name: CI

on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run Biome checks
        run: pnpm check

      # なぜかwranglerの型チェックがCIで失敗するため、一時的にコメントアウト
      # - name: Run Wrangler type checks
      #   run: pnpm --filter worker exec wrangler types --check

      - name: Build project
        run: pnpm build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}

      - name: Run tests
        run: pnpm test
        env:
          CLERK_PUBLISHABLE_KEY: test-key
          CLERK_SECRET_KEY: test-secret
          ALLOWED_EMAILS: admin@example.com

